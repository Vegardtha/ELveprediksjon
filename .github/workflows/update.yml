# Ny prognose hver 2. time, publisert til GitHub Pages.
# Krever repo-secret NVE_API_KEY og Pages-kilde «GitHub Actions» (Settings → Pages).
name: Oppdater prognose

on:
  schedule:
    - cron: "17 */2 * * *" # UTC; ikke hel time, da GitHub kan forsinke eller droppe kjøringer
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Installer Python-avhengigheter
        run: uv sync --frozen --directory backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer frontend-avhengigheter
        run: npm ci --prefix frontend

      - name: Beregn prognose
        env:
          NVE_API_KEY: ${{ secrets.NVE_API_KEY }}
        run: uv run --directory backend python scripts/update.py

      - name: Eksporter JSON
        run: uv run --directory backend python scripts/export_static.py

      - name: Bygg frontend
        run: npm run build --prefix frontend

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deploy
        uses: actions/deploy-pages@v4
