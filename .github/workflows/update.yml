# Ny prognose hver 2. time, publisert til GitHub Pages.
# Krever repo-secret NVE_API_KEY og Pages-kilde «GitHub Actions» (Settings → Pages).
name: Oppdater prognose

on:
  schedule:
    - cron: "17 */2 * * *" # UTC; ikke hel time, da GitHub kan forsinke eller droppe kjøringer
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # første kjøring etter GTS-oppdatering henter alt på nytt: ca. 13 min for 145 stasjoner
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2 # publiserer ikke major-tagger
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Installer Python-avhengigheter
        run: uv sync --frozen --directory backend

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer frontend-avhengigheter
        run: npm ci --prefix frontend

      # GTS-feltmiddel hentes bare én til to ganger i døgnet (elvepred/model/predict.py: gts_state).
      # Cache-nøkler kan ikke overskrives, så hver kjøring lagrer en ny og gjenoppretter den nyeste.
      - uses: actions/cache@v6
        with:
          path: data/cache
          key: gts-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gts-

      - name: Beregn prognose
        env:
          NVE_API_KEY: ${{ secrets.NVE_API_KEY }}
        run: |
          if [ -z "$NVE_API_KEY" ]; then
            echo "::error::Mangler repo-secret NVE_API_KEY (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          uv run --directory backend python scripts/update.py

      - name: Eksporter JSON
        run: uv run --directory backend python scripts/export_static.py

      - name: Bygg frontend
        run: npm run build --prefix frontend

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  # Egen jobb: deploy-pages i samme jobb som opplastingen fant av og til ikke pakken
  # («No artifacts named github-pages»), og kan nå kjøres på nytt uten ny prognose.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
