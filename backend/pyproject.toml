[project]
name = "elvepred"
version = "0.1.0"
description = "Vannføringsprognoser for padleelver på Østlandet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pyproj>=3.7.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
